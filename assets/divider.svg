<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 20" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080710" stop-opacity="0" />
      <stop offset="15%" stop-color="#00F7FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="1" />
      <stop offset="85%" stop-color="#00F7FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#080710" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
@keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .pulse-line { animation: pulse 2.5s infinite ease-in-out; }
]]></style>
  <!-- Main divider line -->
  <line x1="50" y1="10" x2="800" y2="10" stroke="url(#grad)" stroke-width="2" class="pulse-line" filter="url(#glow)" />
  <!-- Center ornament -->
  <polygon points="420,10 425,5 430,10 425,15" fill="#00F7FF" filter="url(#glow)" />
  <circle cx="425" cy="10" r="1.5" fill="#FFFFFF" />
</svg>
