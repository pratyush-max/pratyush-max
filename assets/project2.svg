<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Glow and Gradient Definitions -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');
    .bg { fill: #0b0914; rx: 8px; stroke: url(#neon-grad); stroke-width: 1.5; stroke-opacity: 0.7; }
    .title { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #00F7FF; letter-spacing: 2px; }
    .subtitle { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
    .desc { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #a5a5c5; }
    .tag { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 9px; fill: #00F7FF; }
    .tag-bg { fill: #141124; rx: 3px; stroke: #00F7FF; stroke-opacity: 0.4; stroke-width: 0.8; }
    .grid { stroke: #8A2BE2; stroke-opacity: 0.15; stroke-width: 0.5; }
    
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 1px #00F7FF); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00F7FF); }
    }
    .pulse-card { animation: pulse 3s infinite ease-in-out; }
]]></style>

  <!-- Card Background -->
  <rect width="400" height="180" class="bg pulse-card" />
  
  <!-- Subtle Internal Grid -->
  <line x1="100" y1="0" x2="100" y2="180" class="grid" />
  <line x1="0" y1="35" x2="400" y2="35" class="grid" />
  
  <!-- Left Side: Icon Container (Financial Growth / LSTM Line) -->
  <g transform="translate(10, 40)">
    <rect x="5" y="5" width="80" height="90" fill="none" stroke="#8A2BE2" stroke-opacity="0.1" rx="4" />
    
    <g transform="translate(45, 45)" filter="url(#neon-glow)">
      <!-- Axis -->
      <line x1="-25" y1="25" x2="25" y2="25" stroke="#8A2BE2" stroke-width="1.5" />
      <line x1="-25" y1="-25" x2="-25" y2="25" stroke="#8A2BE2" stroke-width="1.5" />
      
      <!-- Prediction area glow -->
      <path d="M-5,15 L10,-10 L25,-22 L25,25 L-5,25 Z" fill="#00F7FF" fill-opacity="0.15" />
      
      <!-- Graph Line -->
      <path d="M-25,10 L-15,5 L-5,15 L10,-10 L25,-22" fill="none" stroke="#00F7FF" stroke-width="2.2" />
      
      <!-- Data Nodes -->
      <circle cx="-25" cy="10" r="3" fill="#8A2BE2" />
      <circle cx="-15" cy="5" r="3" fill="#8A2BE2" />
      <circle cx="-5" cy="15" r="3" fill="#8A2BE2" />
      <circle cx="10" cy="-10" r="3" fill="#8A2BE2" />
      <circle cx="25" cy="-22" r="4.5" fill="#FFFFFF" />
      
      <!-- Pulsing Target Prediction -->
      <circle cx="25" cy="-22" r="6" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.6">
        <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
  
  <!-- Right Side: Content -->
  <g transform="translate(115, 0)">
    <!-- Tech Title -->
    <text x="0" y="23" class="title">PROJECT_02 // FORECAST_LSTM</text>
    
    <!-- Human Subtitle -->
    <text x="0" y="55" class="subtitle">Stock Market Forecasting</text>
    
    <!-- Description -->
    <text x="0" y="78" class="desc">
      <tspan x="0" dy="0">Hybrid ARIMA &amp; Deep LSTM Neural Network</tspan>
      <tspan x="0" dy="16">model architectures built for predictive</tspan>
      <tspan x="0" dy="16">financial market analysis.</tspan>
    </text>
    
    <!-- Tags -->
    <!-- Tag 1 -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="70" height="18" class="tag-bg" />
      <text x="35" y="12" class="tag" text-anchor="middle">TENSORFLOW</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(77, 140)">
      <rect x="0" y="0" width="50" height="18" class="tag-bg" />
      <text x="25" y="12" class="tag" text-anchor="middle">PYTORCH</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(134, 140)">
      <rect x="0" y="0" width="50" height="18" class="tag-bg" />
      <text x="25" y="12" class="tag" text-anchor="middle">PANDAS</text>
    </g>
  </g>
</svg>
