<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');
    .bg { fill: #0b0914; rx: 8px; stroke: #8A2BE2; stroke-opacity: 0.3; stroke-width: 1.5; }
    .title { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; letter-spacing: 2px; }
    .artist { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 12px; fill: #00F7FF; letter-spacing: 1.5px; }
    .system { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #a5a5c5; }
    .bar-bg { fill: #141124; rx: 2px; stroke: #8A2BE2; stroke-opacity: 0.1; stroke-width: 1; }
    
    @keyframes progress {
      0% { width: 0; }
      100% { width: 370px; }
    }
    .bar-fill { fill: url(#neon-grad); rx: 2px; animation: progress 30s linear infinite; filter: url(#neon-glow); }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .pulse-logo { transform-origin: 45px 60px; animation: pulse 2s infinite ease-in-out; }
]]></style>

  <!-- Player Background -->
  <rect width="850" height="120" class="bg" />

  <!-- Technical Grid overlay -->
  <line x1="90" y1="0" x2="90" y2="120" stroke="#8A2BE2" stroke-opacity="0.15" stroke-width="1" />
  
  <!-- Spotify Pulsing Icon -->
  <g class="pulse-logo" filter="url(#neon-glow)">
    <!-- Spotify Circle -->
    <circle cx="45" cy="60" r="22" fill="none" stroke="#00F7FF" stroke-width="2.2" />
    <!-- Wave bars -->
    <path d="M37,68 Q45,61 53,68" fill="none" stroke="#00F7FF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M34,60 Q45,52 56,60" fill="none" stroke="#00F7FF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M31,52 Q45,43 59,52" fill="none" stroke="#00F7FF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Track Details -->
  <g transform="translate(110, 0)">
    <text x="0" y="38" class="title">NEURAL_RESONANCE.FLAC</text>
    <text x="0" y="58" class="artist">&gt; ARTIST: CYBER_PULSE_SYSTEM</text>
    <text x="0" y="76" class="system">STREAMING // BITRATE: 1411 KBPS // CHANNELS: 2.0</text>
    
    <!-- Playback progress bar -->
    <!-- Bar Container -->
    <rect x="0" y="90" width="480" height="5" class="bar-bg" />
    <!-- Progress Bar -->
    <rect x="0" y="90" width="0" height="5" class="bar-fill" />
    
    <!-- Progress stats -->
    <text x="495" y="95" class="system" font-size="10">02:45 / 03:00</text>
  </g>

  <!-- Equalizer Visualizer Bars -->
  <g transform="translate(720, 20)">
    <rect x="0" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="10" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="20" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="30" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="40" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="50" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="60" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    <rect x="70" y="0" width="4" height="80" fill="#8A2BE2" fill-opacity="0.15" rx="1" />
    
    <!-- Animated bars -->
    <rect x="0" y="30" width="4" height="50" fill="#00F7FF" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="20;75;10;55;20" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="60;5;70;25;60" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="10" width="4" height="70" fill="#8A2BE2" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="50;15;75;30;50" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;65;5;50;30" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="45" width="4" height="35" fill="#00F7FF" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="10;75;40;65;10" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="70;5;40;15;70" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="15" width="4" height="65" fill="#8A2BE2" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="70;30;50;15;70" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;50;30;65;10" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="5" width="4" height="75" fill="#00F7FF" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="30;70;15;50;30" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="50;10;65;30;50" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <rect x="50" y="25" width="4" height="55" fill="#8A2BE2" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="60;10;75;45;60" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;70;5;35;20" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="60" y="40" width="4" height="40" fill="#00F7FF" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="15;50;10;75;15" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="65;30;70;5;65" dur="2.6s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="20" width="4" height="60" fill="#8A2BE2" rx="1" filter="url(#neon-glow)">
      <animate attributeName="height" values="45;75;20;60;45" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;5;60;20;35" dur="2.0s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
