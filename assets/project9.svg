<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Glow and Gradient Definitions -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');
    .bg { fill: #0b0914; rx: 8px; stroke: url(#neon-grad); stroke-width: 1.5; stroke-opacity: 0.7; }
    .title { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #00F7FF; letter-spacing: 2px; }
    .subtitle { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
    .desc { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #a5a5c5; }
    .tag { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 9px; fill: #00F7FF; }
    .tag-bg { fill: #141124; rx: 3px; stroke: #00F7FF; stroke-opacity: 0.4; stroke-width: 0.8; }
    .grid { stroke: #8A2BE2; stroke-opacity: 0.15; stroke-width: 0.5; }
    
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 1px #00F7FF); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00F7FF); }
    }
    .pulse-card { animation: pulse 3s infinite ease-in-out; }
  ]]></style>

  <!-- Card Background -->
  <rect width="400" height="180" class="bg pulse-card" />
  
  <!-- Subtle Internal Grid -->
  <line x1="100" y1="0" x2="100" y2="180" class="grid" />
  <line x1="0" y1="35" x2="400" y2="35" class="grid" />
  
  <!-- Left Side: Icon Container (Lakehouse Medallion Stack + Pulse) -->
  <g transform="translate(10, 40)">
    <!-- Tech boundary box -->
    <rect x="5" y="5" width="80" height="90" fill="none" stroke="#8A2BE2" stroke-opacity="0.1" rx="4" />
    
    <!-- Graphic Drawing -->
    <g transform="translate(45, 45)" filter="url(#neon-glow)">
      <!-- Bronze Layer (Bottom) -->
      <ellipse cx="0" cy="19" rx="20" ry="6" fill="#141124" stroke="#8A2BE2" stroke-width="1.3" />
      
      <!-- Silver Layer (Middle) -->
      <path d="M-20,8 A20,6 0 0,0 20,8 L20,19 A20,6 0 0,1 -20,19 Z" fill="none" stroke="#8A2BE2" stroke-width="1" />
      <ellipse cx="0" cy="8" rx="20" ry="6" fill="#141124" stroke="#00F7FF" stroke-width="1.3" />
      
      <!-- Gold Layer (Top) -->
      <path d="M-20,-3 A20,6 0 0,0 20,-3 L20,8 A20,6 0 0,1 -20,8 Z" fill="none" stroke="#00F7FF" stroke-width="1" />
      <ellipse cx="0" cy="-3" rx="20" ry="6" fill="#141124" stroke="#00F7FF" stroke-width="1.6" />
      
      <!-- Pulse / ECG Wave Overlay -->
      <path d="M-25,-16 L-11,-16 L-6,-27 L0,-7 L6,-21 L11,-16 L25,-16" fill="none" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Pulse Nodes -->
      <circle cx="-6" cy="-27" r="2.2" fill="#8A2BE2" />
      <circle cx="6" cy="-21" r="2" fill="#00F7FF" />
      
      <!-- Scanning corners -->
      <path d="M-30,-20 L-22,-20" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,-20 L-30,-12" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,-20 L22,-20" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,-20 L30,-12" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,30 L-22,30" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,30 L-30,22" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,30 L22,30" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,30 L30,22" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
    </g>
  </g>
  
  <!-- Right Side: Content -->
  <g transform="translate(115, 0)">
    <!-- Tech Title -->
    <text x="0" y="23" class="title">PROJECT_09 // SHOPPULSE_DE</text>
    
    <!-- Human Subtitle -->
    <text x="0" y="55" class="subtitle">ShopPulse - Lakehouse BI</text>
    
    <!-- Description -->
    <text x="0" y="78" class="desc">
      <tspan x="0" dy="0">End-to-end Medallion Lakehouse on</tspan>
      <tspan x="0" dy="16">Databricks &amp; Delta Lake with 4-page</tspan>
      <tspan x="0" dy="16">Power BI analytics &amp; PySpark ETL.</tspan>
    </text>
    
    <!-- Tags -->
    <!-- Tag 1: DATABRICKS -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="76" height="18" class="tag-bg" />
      <text x="38" y="12" class="tag" text-anchor="middle">DATABRICKS</text>
    </g>
    <!-- Tag 2: PYSPARK -->
    <g transform="translate(82, 140)">
      <rect x="0" y="0" width="60" height="18" class="tag-bg" />
      <text x="30" y="12" class="tag" text-anchor="middle">PYSPARK</text>
    </g>
    <!-- Tag 3: POWER BI -->
    <g transform="translate(148, 140)">
      <rect x="0" y="0" width="64" height="18" class="tag-bg" />
      <text x="32" y="12" class="tag" text-anchor="middle">POWER BI</text>
    </g>
  </g>
</svg>
