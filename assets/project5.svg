<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Glow and Gradient Definitions -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Share+Tech+Mono&amp;display=swap');
    .bg { fill: #0b0914; rx: 8px; stroke: url(#neon-grad); stroke-width: 1.5; stroke-opacity: 0.7; }
    .title { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #00F7FF; letter-spacing: 2px; }
    .subtitle { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
    .desc { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #a5a5c5; }
    .tag { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 9px; fill: #00F7FF; }
    .tag-bg { fill: #141124; rx: 3px; stroke: #00F7FF; stroke-opacity: 0.4; stroke-width: 0.8; }
    .grid { stroke: #8A2BE2; stroke-opacity: 0.15; stroke-width: 0.5; }
    
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 1px #00F7FF); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00F7FF); }
    }
    .pulse-card { animation: pulse 3s infinite ease-in-out; }
  </style>

  <!-- Card Background -->
  <rect width="400" height="180" class="bg pulse-card" />
  
  <!-- Subtle Internal Grid -->
  <line x1="100" y1="0" x2="100" y2="180" class="grid" />
  <line x1="0" y1="35" x2="400" y2="35" class="grid" />
  
  <!-- Left Side: Icon Container (CV Aperture Eye) -->
  <g transform="translate(10, 40)">
    <rect x="5" y="5" width="80" height="90" fill="none" stroke="#8A2BE2" stroke-opacity="0.1" rx="4" />
    
    <g transform="translate(45, 45)" filter="url(#neon-glow)">
      <!-- Outer Eye -->
      <path d="M-30,0 Q0,-20 30,0 Q0,20 -30,0 Z" fill="none" stroke="#8A2BE2" stroke-width="1.8" />
      
      <!-- Iris / Ring -->
      <circle cx="0" cy="0" r="10.5" fill="none" stroke="#00F7FF" stroke-width="1.5" />
      
      <!-- Pupil -->
      <circle cx="0" cy="0" r="4.5" fill="#00F7FF" />
      
      <!-- Tech Frame Bounds -->
      <path d="M-15,-12 L-12,-12" stroke="#00F7FF" stroke-width="1" />
      <path d="M-15,-12 L-15,-9" stroke="#00F7FF" stroke-width="1" />
      <path d="M15,12 L12,12" stroke="#00F7FF" stroke-width="1" />
      <path d="M15,12 L15,9" stroke="#00F7FF" stroke-width="1" />
      
      <!-- Scanning Laser -->
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.8">
        <animate attributeName="y1" values="-12;12;-12" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-12;12;-12" dur="2.5s" repeatCount="indefinite" />
      </line>
    </g>
  </g>
  
  <!-- Right Side: Content -->
  <g transform="translate(115, 0)">
    <!-- Tech Title -->
    <text x="0" y="23" class="title">PROJECT_05 // VISION_CORE</text>
    
    <!-- Human Subtitle -->
    <text x="0" y="55" class="subtitle">Computer Vision Suite</text>
    
    <!-- Description -->
    <text x="0" y="78" class="desc">
      <tspan x="0" dy="0">Advanced image filters, object recognition</tspan>
      <tspan x="0" dy="16">pipelines, and face tracking algorithms built</tspan>
      <tspan x="0" dy="16">leveraging modern vision frameworks.</tspan>
    </text>
    
    <!-- Tags -->
    <!-- Tag 1 -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="tag" text-anchor="middle">OPENCV</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(62, 140)">
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="tag" text-anchor="middle">PYTORCH</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(124, 140)">
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="tag" text-anchor="middle">PYTHON</text>
    </g>
  </g>
</svg>
