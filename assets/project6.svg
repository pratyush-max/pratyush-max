<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Glow and Gradient Definitions -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');
    .bg { fill: #0b0914; rx: 8px; stroke: url(#neon-grad); stroke-width: 1.5; stroke-opacity: 0.7; }
    .title { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #00F7FF; letter-spacing: 2px; }
    .subtitle { font-family: 'Orbitron', 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
    .desc { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #a5a5c5; }
    .tag { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 9px; fill: #00F7FF; }
    .tag-bg { fill: #141124; rx: 3px; stroke: #00F7FF; stroke-opacity: 0.4; stroke-width: 0.8; }
    .grid { stroke: #8A2BE2; stroke-opacity: 0.15; stroke-width: 0.5; }
    
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 1px #00F7FF); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00F7FF); }
    }
    .pulse-card { animation: pulse 3s infinite ease-in-out; }
  ]]></style>

  <!-- Card Background -->
  <rect width="400" height="180" class="bg pulse-card" />
  
  <!-- Subtle Internal Grid -->
  <line x1="100" y1="0" x2="100" y2="180" class="grid" />
  <line x1="0" y1="35" x2="400" y2="35" class="grid" />
  
  <!-- Left Side: Icon Container (AI Chat Node) -->
  <g transform="translate(10, 40)">
    <!-- Tech boundary box -->
    <rect x="5" y="5" width="80" height="90" fill="none" stroke="#8A2BE2" stroke-opacity="0.1" rx="4" />
    
    <!-- AI Brain/Chat Node drawing -->
    <g transform="translate(45, 45)" filter="url(#neon-glow)">
      <!-- Headset/Outer ring -->
      <path d="M-22,10 A22,22 0 0,1 22,10" fill="none" stroke="#8A2BE2" stroke-width="1.5" />
      <!-- Speaking waves -->
      <path d="M-28,10 L-26,10 M-28,15 L-24,15 M26,10 L28,10 M24,15 L28,15" fill="none" stroke="#00F7FF" stroke-width="1.5" />
      
      <!-- Central brain core -->
      <circle cx="0" cy="-5" r="7" fill="none" stroke="#00F7FF" stroke-width="1.8" />
      <circle cx="0" cy="-5" r="3" fill="#8A2BE2" />
      
      <!-- Connected Neural Nodes -->
      <line x1="0" y1="-5" x2="-14" y2="-17" stroke="#00F7FF" stroke-width="1.2" />
      <line x1="0" y1="-5" x2="14" y2="-17" stroke="#00F7FF" stroke-width="1.2" />
      <line x1="0" y1="-5" x2="0" y2="14" stroke="#00F7FF" stroke-width="1.2" />
      
      <circle cx="-14" cy="-17" r="4.5" fill="#0b0914" stroke="#00F7FF" stroke-width="1.5" />
      <circle cx="14" cy="-17" r="4.5" fill="#0b0914" stroke="#00F7FF" stroke-width="1.5" />
      <circle cx="0" cy="14" r="4.5" fill="#0b0914" stroke="#8A2BE2" stroke-width="1.5" />
      
      <!-- Pulse dot inside node -->
      <circle cx="-14" cy="-17" r="1.5" fill="#00F7FF" />
      <circle cx="14" cy="-17" r="1.5" fill="#00F7FF" />
      <circle cx="0" cy="14" r="1.5" fill="#8A2BE2" />
      
      <!-- Scanning corners -->
      <path d="M-30,-20 L-22,-20" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,-20 L-30,-12" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,-20 L22,-20" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,-20 L30,-12" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,30 L-22,30" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M-30,30 L-30,22" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,30 L22,30" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
      <path d="M30,30 L30,22" fill="none" stroke="#8A2BE2" stroke-width="1.2" />
    </g>
  </g>
  
  <!-- Right Side: Content -->
  <g transform="translate(115, 0)">
    <!-- Tech Title -->
    <text x="0" y="23" class="title">PROJECT_06 // KRMU_AI_AGENT</text>
    
    <!-- Human Subtitle -->
    <text x="0" y="55" class="subtitle">KRMU AI Chat Assistant</text>
    
    <!-- Description -->
    <text x="0" y="78" class="desc">
      <tspan x="0" dy="0">Production university portal grounded with</tspan>
      <tspan x="0" dy="16">scraped RAG vector search, premium NextJS</tspan>
      <tspan x="0" dy="16">SaaS UI, and TTS speech synthesis.</tspan>
    </text>
    
    <!-- Tags -->
    <!-- Tag 1 -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="70" height="18" class="tag-bg" />
      <text x="35" y="12" class="tag" text-anchor="middle">TYPESCRIPT</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(77, 140)">
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="tag" text-anchor="middle">NEXT.JS</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(139, 140)">
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="tag" text-anchor="middle">EXPRESS</text>
    </g>
  </g>
</svg>
